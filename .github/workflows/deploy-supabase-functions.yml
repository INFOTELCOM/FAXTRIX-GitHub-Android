name: Supabase Edge Functions — configuration check

on:
  workflow_dispatch:

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "TURN deployment is not activated yet."
            echo "Configure SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF before enabling automatic deployment."
            exit 0
          fi
          echo "Supabase deployment secrets are configured."
          echo "Automatic Edge Function deployment remains intentionally manual."
