name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Vérifier les secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: xtkcfhbsksoqbpnaciga
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN manquant"; exit 1; }
      - name: Déployer les fonctions IA et TURN
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy google-search --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy ai-research --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy ai-assistant --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy turn-ice-servers --project-ref "$SUPABASE_PROJECT_REF"
